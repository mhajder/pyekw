name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What do you want to do with KW numbers that pyekw cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new function, describe its name, arguments and what it returns.
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: Link to the eKW docs, regulation or court data this would use, if you know it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
