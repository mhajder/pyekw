name: Bug report
description: Something in pyekw does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove anything private from what you paste below.
        For security issues, use [private vulnerability reporting](https://github.com/mhajder/pyekw/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the function you called and the error or wrong result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet is best.
      render: python
      placeholder: |
        from pyekw import KWValidator

        KWValidator().validate_kw_number("WA4M/00123456/4")
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pyekw version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.13.5
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - uv / pip (PyPI)
        - From source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback
      description: Full traceback, if there is one.
      render: text
