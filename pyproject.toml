[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyekw"
version = "0.3.0"
description = "Python library for Polish eKW (Land Registry)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Mateusz Hajder"},
]
keywords = ["ekw", "land-registry", "poland", "validation", "utilities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = []

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "typos>=1.51.1",
]

[project.scripts]
pyekw = "pyekw.cli:main"

[project.urls]
Homepage = "https://github.com/mhajder/pyekw"
Repository = "https://github.com/mhajder/pyekw"
Documentation = "https://github.com/mhajder/pyekw#readme"
Issues = "https://github.com/mhajder/pyekw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyekw"]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10+.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # Perflint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

ignore = [
    "E501",  # Line too long, handled by formatter
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S107"]  # Allow assert and hardcoded passwords in tests
"examples/*" = ["T201"]
"src/pyekw/cli.py" = ["T201"]  # The CLI prints its output

[tool.ruff.lint.isort]
known-first-party = ["pyekw"]
force-single-line = true

[tool.pytest]
testpaths = ["tests", "README.md"]
addopts = [
    "--doctest-glob=README.md",
    "--cov=pyekw",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.typos.default.extend-words]
# Polish court names in courts_data.py
nowe = "nowe"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
version_files = ["CITATION.cff:^version"]
update_changelog_on_bump = true
major_version_zero = true
